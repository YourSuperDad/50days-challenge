<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ Accordion</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      color: #1e1b4b;
    }

    .faq {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(79, 70, 229, 0.15);
    }

    .subtitle {
      color: #6366f1;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .faq h1 { font-size: 1.6rem; margin-bottom: 24px; }

    /* ---------- FAQ items ---------- */
    .faq-item { border-top: 1px solid #e5e7eb; }
    .faq-item:last-child { border-bottom: 1px solid #e5e7eb; }

    .faq-heading { margin: 0; font-size: inherit; font-weight: inherit; }

    .faq-question {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 4px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #1e1b4b;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s;
    }
    .faq-question:hover { color: #4f46e5; }
    .faq-question:focus-visible {
      outline: 2px solid #4f46e5;
      outline-offset: 4px;
      border-radius: 6px;
    }

    .chevron {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: #6366f1;
      transition: transform 0.25s ease;
    }
    .faq-question[aria-expanded="true"] .chevron { transform: rotate(180deg); }

    /* ---------- Collapsible panel ---------- */
    .faq-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }
    .faq-panel.open { grid-template-rows: 1fr; }
    .faq-panel-inner { overflow: hidden; }

    .faq-panel-inner p {
      padding: 0 4px 20px;
      color: #4b5563;
      font-size: 0.93rem;
      line-height: 1.6;
    }

    .faq-panel-inner p.awaiting {
      color: #9ca3af;
      font-style: italic;
    }

    /* ---------- Add a question ---------- */
    .add-question { margin-top: 22px; }

    .add-btn {
      width: 100%;
      padding: 13px;
      background: #f9fafb;
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      color: #6366f1;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .add-btn:hover { background: #eef2ff; border-color: #a5b4fc; }

    .add-form {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .add-form input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-form input:focus { border-color: #6366f1; }
    .add-form button {
      padding: 12px 20px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .add-form button:hover { background: #4338ca; }

    /* ---------- Admin answer form ---------- */
    .answer-form { padding: 0 4px 20px; }
    .answer-form textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .answer-form textarea:focus { border-color: #6366f1; }
    .answer-save {
      padding: 8px 18px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .answer-save:hover { background: #4338ca; }

    /* ---------- Admin footer ---------- */
    .admin-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }
    .admin-toggle {
      background: none;
      border: none;
      color: #9ca3af;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .admin-toggle:hover { color: #6366f1; background: #f3f4f6; }
    .admin-bar {
      margin-top: 10px;
      padding: 10px 14px;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.8rem;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>
  <main class="faq">
    <p class="subtitle">Help center</p>
    <h1>Frequently asked questions</h1>

    <div id="faq-list"></div>

    <!-- Ask a question -->
    <div class="add-question">
      <button id="add-toggle" class="add-btn">+ Ask a question</button>
      <form id="add-form" class="add-form" hidden>
        <input id="question-input" type="text" maxlength="200"
               placeholder="Type your question..." required />
        <button type="submit">Submit</button>
      </form>
    </div>

    <!-- Owner access -->
    <div class="admin-footer">
      <button id="admin-toggle" class="admin-toggle">Support team access</button>
      <div id="admin-bar" class="admin-bar" hidden>
        Admin mode — expand any unanswered question to type its answer.
      </div>
    </div>
  </main>

  <script>
    /* =========================================================
       1. DEFAULT FAQS (owner-written)
       ========================================================= */
    const DEFAULT_FAQS = [
      {
        id: "seed-1",
        question: "How do I reset my password?",
        answer: "Click “Forgot password” on the sign-in screen. We’ll email you a secure link to choose a new one. The link expires after 30 minutes for your safety."
      },
      {
        id: "seed-2",
        question: "Can I cancel my subscription anytime?",
        answer: "Yes. You can cancel from Account → Billing at any time. You’ll keep access until the end of your current billing period, and you won’t be charged again."
      },
      {
        id: "seed-3",
        question: "Do you offer refunds?",
        answer: "We offer a full refund within 14 days of purchase, no questions asked. Email support with your order number and we’ll process it within 2 business days."
      },
      {
        id: "seed-4",
        question: "How do I contact support?",
        answer: "Reach us at help@example.com or use the chat bubble in the bottom-right corner of any page. We reply within a few hours on weekdays."
      },
      {
        id: "seed-5",
        question: "Is my data secure?",
        answer: "Yes. All traffic is encrypted in transit with TLS 1.3, and data at rest is encrypted with AES-256. We never sell your data, and we’re fully GDPR compliant."
      }
    ];

    /* =========================================================
       2. STORAGE (user-submitted items only — seeds live in code)
       ========================================================= */
    const STORAGE_KEY = "faq_user_items_v1";

    function loadUserFaqs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch { return []; }
    }

    function saveUserFaqs() {
      const data = Array.from(document.querySelectorAll("#faq-list .faq-item[data-user-id]"))
        .map(function (item) {
          return {
            id: item.dataset.userId,
            question: item.dataset.question,
            answer: item.dataset.answer || ""
          };
        });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    }

    /* =========================================================
       3. STATE
       ========================================================= */
    let openIndex = 0;        // which item is expanded (-1 = none)
    let adminMode = false;    // reveals answer textareas on unanswered items

    /* =========================================================
       4. ELEMENT REFERENCES
       ========================================================= */
    const faqList       = document.getElementById("faq-list");
    const addToggle     = document.getElementById("add-toggle");
    const addForm       = document.getElementById("add-form");
    const questionInput = document.getElementById("question-input");
    const adminToggle   = document.getElementById("admin-toggle");
    const adminBar      = document.getElementById("admin-bar");

    /* =========================================================
       5. HELPERS
       ========================================================= */
    // Escape user text so it can't inject HTML
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text == null ? "" : text);
      return div.innerHTML;
    }

    // Single shared chevron SVG
    const CHEVRON_SVG =
      '<svg class="chevron" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' +
      '<polyline points="6 9 12 15 18 9"/></svg>';

    /* =========================================================
       6. THE SHARED ENTRIES ARRAY
       Every item — seed or user — lives here as {button, panel}.
       ========================================================= */
    const entries = [];

    /* =========================================================
       7. RENDER — paint every item's open/closed state
       ========================================================= */
    function render() {
      entries.forEach(function (entry, index) {
        const isOpen = index === openIndex;
        entry.button.setAttribute("aria-expanded", isOpen ? "true" : "false");
        entry.panel.classList.toggle("open", isOpen);
      });
    }

    /* =========================================================
       8. PANEL CONTENT — decides what to show inside a user item
       ========================================================= */
    function renderUserPanel(item) {
      const answer = item.dataset.answer || "";
      const inner  = item.querySelector(".faq-panel-inner");

      if (answer.trim() !== "") {
        // Answered: normal paragraph — identical to a seed answer
        inner.innerHTML = "<p>" + escapeHtml(answer) + "</p>";
        return;
      }

      if (adminMode) {
        // Owner sees a textarea to write the answer
        inner.innerHTML =
          '<div class="answer-form">' +
            '<textarea placeholder="Type the answer..." rows="3"></textarea>' +
            '<button class="answer-save">Save answer</button>' +
          '</div>';

        inner.querySelector(".answer-save").addEventListener("click", function () {
          const value = inner.querySelector("textarea").value.trim();
          if (!value) return;
          item.dataset.answer = value;
          saveUserFaqs();
          renderUserPanel(item);
        });
      } else {
        // Public: waiting message
        inner.innerHTML = '<p class="awaiting">Awaiting answer from support team.</p>';
      }
    }

    /* =========================================================
       9. BUILD A USER-SUBMITTED ITEM (fresh from storage or form)
       ========================================================= */
    function createUserItem(data) {
      const item = document.createElement("div");
      item.className = "faq-item";
      item.dataset.userId   = data.id;
      item.dataset.question = data.question;
      item.dataset.answer   = data.answer || "";

      item.innerHTML =
        '<h2 class="faq-heading">' +
          '<button class="faq-question" aria-expanded="false">' +
            '<span>' + escapeHtml(data.question) + '</span>' +
            CHEVRON_SVG +
          '</button>' +
        '</h2>' +
        '<div class="faq-panel">' +
          '<div class="faq-panel-inner"></div>' +
        '</div>';

      const btn   = item.querySelector(".faq-question");
      const panel = item.querySelector(".faq-panel");
      const idx   = entries.length;

      entries.push({ button: btn, panel: panel });

      btn.addEventListener("click", function () {
        openIndex = (openIndex === idx) ? -1 : idx;
        render();
      });

      renderUserPanel(item);
      return item;
    }

    /* =========================================================
       10. BUILD THE SEED ITEMS FROM DEFAULT_FAQS
       ========================================================= */
    function createSeedItem(faq) {
      const item = document.createElement("div");
      item.className = "faq-item";

      item.innerHTML =
        '<h2 class="faq-heading">' +
          '<button class="faq-question" aria-expanded="false">' +
            '<span>' + escapeHtml(faq.question) + '</span>' +
            CHEVRON_SVG +
          '</button>' +
        '</h2>' +
        '<div class="faq-panel">' +
          '<div class="faq-panel-inner">' +
            '<p>' + escapeHtml(faq.answer) + '</p>' +
          '</div>' +
        '</div>';

      const btn   = item.querySelector(".faq-question");
      const panel = item.querySelector(".faq-panel");
      const idx   = entries.length;

      entries.push({ button: btn, panel: panel });

      btn.addEventListener("click", function () {
        openIndex = (openIndex === idx) ? -1 : idx;
        render();
      });

      return item;
    }

    /* =========================================================
       11. INITIAL MOUNT — seeds first, then any saved user items
       ========================================================= */
    DEFAULT_FAQS.forEach(function (faq) {
      faqList.appendChild(createSeedItem(faq));
    });

    loadUserFaqs().forEach(function (data) {
      faqList.appendChild(createUserItem(data));
    });

    render();  // open the first item

    /* =========================================================
       12. "+ ASK A QUESTION"
       ========================================================= */
    addToggle.addEventListener("click", function () {
      addForm.hidden = !addForm.hidden;
      if (!addForm.hidden) questionInput.focus();
    });

    addForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const text = questionInput.value.trim();
      if (!text) return;

      const data = { id: "user-" + Date.now(), question: text, answer: "" };
      faqList.appendChild(createUserItem(data));
      saveUserFaqs();

      openIndex = entries.length - 1;  // auto-open the new question
      render();

      questionInput.value = "";
      addForm.hidden = true;
    });

    /* =========================================================
       13. ADMIN MODE
       ========================================================= */
    adminToggle.addEventListener("click", function () {
      adminMode = !adminMode;
      adminBar.hidden = !adminMode;
      adminToggle.textContent = adminMode ? "Exit admin mode" : "Support team access";

      // Re-render the panels of every user item so textareas swap in/out
      document.querySelectorAll("#faq-list .faq-item[data-user-id]")
        .forEach(renderUserPanel);

      // Keep the currently open item open after re-render
      render();
    });
  </script>
</body>
</html>
