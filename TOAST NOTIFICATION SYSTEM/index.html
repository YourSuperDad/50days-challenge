<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Notification System</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        background: linear-gradient(135deg, #f0fdf4, #eff6ff);
        color: #1e293b;
      }

      .page {
        max-width: 480px;
        text-align: center;
      }
      .page h1 {
        font-size: 1.7rem;
        margin-bottom: 8px;
      }
      .page p {
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 24px;
        font-size: 0.95rem;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .demo-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.15s;
      }
      .demo-btn:hover {
        transform: translateY(-1px);
      }
      .demo-btn:focus-visible {
        outline: 3px solid #3b82f6;
        outline-offset: 2px;
      }

      .btn-success {
        background: #dcfce7;
        color: #166534;
      }
      .btn-error {
        background: #fee2e2;
        color: #991b1b;
      }
      .btn-info {
        background: #dbeafe;
        color: #1e40af;
      }
      .btn-warn {
        background: #fef3c7;
        color: #92400e;
      }

      /* ---------- Toast container ---------- */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 9999;
        pointer-events: none; /* container clicks pass through to page */
        max-width: calc(100vw - 40px);
      }

      /* ---------- Individual toast ---------- */
      .toast {
        pointer-events: auto; /* re-enable clicks on the toast itself */
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 280px;
        max-width: 380px;
        padding: 14px 16px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        border-left: 4px solid #64748b;
        font-size: 0.88rem;
        color: #1e293b;
        animation: slideIn 0.25s ease;
      }
      .toast.leaving {
        animation: slideOut 0.25s ease forwards;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          transform: translateX(100%);
        }
      }

      /* Icon circle */
      .toast-icon {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 900;
      }

      /* Text area */
      .toast-body {
        flex: 1;
      }
      .toast-title {
        font-weight: 700;
        margin-bottom: 2px;
      }
      .toast-message {
        color: #475569;
        font-size: 0.85rem;
        line-height: 1.4;
      }

      /* Close button */
      .toast-close {
        flex-shrink: 0;
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 1.1rem;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        transition: color 0.15s;
      }
      .toast-close:hover {
        color: #475569;
      }
      .toast-close:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ---------- Variants ---------- */
      .toast.success {
        border-left-color: #22c55e;
      }
      .toast.success .toast-icon {
        background: #22c55e;
      }

      .toast.error {
        border-left-color: #ef4444;
      }
      .toast.error .toast-icon {
        background: #ef4444;
      }

      .toast.info {
        border-left-color: #3b82f6;
      }
      .toast.info .toast-icon {
        background: #3b82f6;
      }

      .toast.warning {
        border-left-color: #f59e0b;
      }
      .toast.warning .toast-icon {
        background: #f59e0b;
      }

      /* Auto-dismiss progress bar */
      .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: currentColor;
        opacity: 0.3;
        animation: shrink linear forwards;
      }
      @keyframes shrink {
        from {
          width: 100%;
        }
        to {
          width: 0%;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <h1>Toast Notifications</h1>
      <p>
        Click any button to trigger a toast. They appear in the corner, stack
        when multiple appear, and dismiss themselves after a few seconds. The
        page behind stays fully usable.
      </p>

      <div class="buttons">
        <button class="demo-btn btn-success" data-toast="success">
          Success
        </button>
        <button class="demo-btn btn-error" data-toast="error">Error</button>
        <button class="demo-btn btn-info" data-toast="info">Info</button>
        <button class="demo-btn btn-warn" data-toast="warning">Warning</button>
      </div>
    </div>

    <!-- Where all toasts live -->
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <script>
      /* =========================================================
       1. ELEMENT REFERENCE + STATE
       ========================================================= */
      const container = document.getElementById("toast-container");

      // How long a toast lives before auto-dismiss (milliseconds).
      const DEFAULT_DURATION = 4000;

      // Track active toasts so we can clean up timers on manual close.
      const activeTimers = new Map();

      /* =========================================================
       2. ICON MAP — the little letter inside the circle
       ========================================================= */
      const ICONS = {
        success: "✓",
        error: "✕",
        info: "i",
        warning: "!",
      };

      /* =========================================================
       3. CREATE ONE TOAST
       ========================================================= */
      function showToast(options) {
        const type = options.type || "info";
        const title = options.title || "";
        const message = options.message || "";
        const duration =
          options.duration != null ? options.duration : DEFAULT_DURATION;

        // --- build the toast element ---
        const toast = document.createElement("div");
        toast.className = "toast " + type;
        toast.setAttribute("role", type === "error" ? "alert" : "status");

        // --- icon ---
        const icon = document.createElement("span");
        icon.className = "toast-icon";
        icon.textContent = ICONS[type] || ICONS.info;
        icon.setAttribute("aria-hidden", "true");

        // --- body ---
        const body = document.createElement("div");
        body.className = "toast-body";

        if (title) {
          const titleEl = document.createElement("div");
          titleEl.className = "toast-title";
          titleEl.textContent = title;
          body.appendChild(titleEl);
        }

        if (message) {
          const msgEl = document.createElement("div");
          msgEl.className = "toast-message";
          msgEl.textContent = message;
          body.appendChild(msgEl);
        }

        // --- close button ---
        const closeBtn = document.createElement("button");
        closeBtn.className = "toast-close";
        closeBtn.setAttribute("aria-label", "Dismiss notification");
        closeBtn.textContent = "×";
        closeBtn.addEventListener("click", function () {
          dismiss(toast);
        });

        // --- progress bar (only if it auto-dismisses) ---
        let progress = null;
        if (duration > 0) {
          progress = document.createElement("span");
          progress.className = "toast-progress";
          progress.style.color = "currentColor";
          progress.style.animationDuration = duration + "ms";
          toast.appendChild(progress);
        }

        // --- assemble ---
        toast.appendChild(icon);
        toast.appendChild(body);
        toast.appendChild(closeBtn);

        container.appendChild(toast);

        // --- schedule auto-dismiss ---
        if (duration > 0) {
          const timerId = setTimeout(function () {
            dismiss(toast);
          }, duration);
          activeTimers.set(toast, timerId);
        }

        return toast;
      }

      /* =========================================================
       4. DISMISS ONE TOAST
       ========================================================= */
      function dismiss(toast) {
        if (!toast || toast.classList.contains("leaving")) return;

        // Cancel the auto-dismiss timer if it's still pending.
        const timerId = activeTimers.get(toast);
        if (timerId) {
          clearTimeout(timerId);
          activeTimers.delete(toast);
        }

        // Play the exit animation, then remove from the DOM.
        toast.classList.add("leaving");
        toast.addEventListener(
          "animationend",
          function () {
            toast.remove();
          },
          { once: true },
        );

        // Safety net: if animationend never fires (e.g., tab is backgrounded),
        // remove the element anyway after the animation should have finished.
        setTimeout(function () {
          if (toast.parentNode) toast.remove();
        }, 400);
      }

      /* =========================================================
       5. DEMO BUTTONS
       ========================================================= */
      const SAMPLES = {
        success: {
          title: "Saved",
          message: "Your changes were saved successfully.",
        },
        error: {
          title: "Oops",
          message: "Something went wrong. Please try again.",
        },
        info: { title: "Heads up", message: "A new version is available." },
        warning: { title: "Careful", message: "This action can't be undone." },
      };

      document.querySelectorAll(".demo-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const type = btn.dataset.toast;
          const sample = SAMPLES[type];
          showToast({
            type: type,
            title: sample.title,
            message: sample.message,
          });
        });
      });
    </script>
  </body>
</html>
